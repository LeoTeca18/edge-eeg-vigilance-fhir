# ==============================================================================
# Eclipse Mosquitto MQTT Broker Configuration
# ==============================================================================
# WHY THIS CONFIGURATION EXISTS:
# Provides lightweight, publish-subscribe message broker configuration for
# telemetry exchange between the edge gateway and presentation dashboard.
# ==============================================================================

# Standard unencrypted MQTT protocol listening port
listener 1883

# Allow anonymous access for local development / isolated Docker networks.
# (In production, replace with TLS certificates and password authentication)
allow_anonymous true

# Persistence: store in-memory messages to disk periodically
persistence true
persistence_location /mosquitto/data/

# Structured diagnostic logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
